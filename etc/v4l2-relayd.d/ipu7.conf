# One instance per loopback device. The generator turns each *.conf in this
# directory into a v4l2-relayd@<name>.service, and CARD_LABEL is how the unit
# finds which /dev/videoN to write to.
#
# VIDEOSRC must NOT end with a capsfilter -- see the guide. The trailing caps
# are redundant anyway: v4l2-relayd copies FORMAT/WIDTH/HEIGHT onto its appsink
# from the output appsrc, so they propagate upstream from the values below.
#
# The 3848x2176 request is not a preference. libcamera's software ISP crops
# rather than scales, so asking it for anything smaller either loses most of the
# field of view or selects a binned sensor mode that aborts. Take the native
# frame and scale it here.
#
# camera-name pins the RGB sensor. Without it libcamerasrc takes libcamera's
# first camera, and which sensor comes first changes from boot to boot. When it
# is the IR sensor (hm1092, \_SB_.LNK0), the 3848x2176 request cannot be met and
# the relay idles with nothing in the journal. The backslashes are unescaped
# three times -- systemd, sh, then gst_parse_launch -- and the value that reaches
# libcamera is \_SB_.LNK1.
VIDEOSRC="libcamerasrc camera-name=\\\"\\\\\\\\_SB_.LNK1\\\" ! video/x-raw,width=3848,height=2176 ! queue max-size-buffers=3 ! videoconvert ! videobalance saturation=1.4 contrast=1.05 ! videoscale method=lanczos"
FORMAT=YUY2
WIDTH=1920
HEIGHT=1080
FRAMERATE=30/1
CARD_LABEL="IPU7 Webcam"
