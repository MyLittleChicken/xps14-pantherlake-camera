[Service]
# libcamera's software ISP needs a dma-buf provider. The stock unit ships
# DevicePolicy=closed with a DeviceAllow list that has none, so the ISP fails to
# initialise, the only format left is raw Bayer, and nothing downstream can
# negotiate it -- black frames, with nothing in the log naming the sandbox.
DeviceAllow=/dev/dma_heap/system rw
DeviceAllow=/dev/udmabuf rw

# The stock output pipeline leaves v4l2sink at its default sync=true. Buffers
# arrive through appsink -> appsrc carrying timestamps the sink judges late, and
# it drops nearly all of them. Only sync=false differs from the stock command.
ExecStart=
ExecStart=/bin/sh -c 'DEVICE=$(grep -l -m1 -E "^${CARD_LABEL}$" /sys/devices/virtual/video4linux/*/name | cut -d/ -f6); exec /usr/bin/v4l2-relayd -i "${VIDEOSRC}" $${SPLASHSRC:+-s "${SPLASHSRC}"} -o "appsrc name=appsrc caps=video/x-raw,format=${FORMAT},width=${WIDTH},height=${HEIGHT},framerate=${FRAMERATE} ! videoconvert ! v4l2sink name=v4l2sink sync=false device=/dev/$${DEVICE}" $EXTRA_OPTS'

# With Agc removed from the tuning file nothing sets the sensor gain, so pin it
# here. Survives stream start and stop, but not a reboot -- hence on every start.
ExecStartPost=/usr/local/bin/ipu7-set-gain 600
