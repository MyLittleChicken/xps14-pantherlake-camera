# WirePlumber's stock "main" profile marks hardware.video-capture as required.
# On this machine both of its monitors can legitimately end up with zero
# devices -- the raw IPU7 nodes are hidden from the V4L2 monitor, and the
# libcamera monitor creates none until the relay is running. A required target
# that never activates stalls profile activation, and default-node assignment
# goes with it: no default audio sink, no sound, no error message.
wireplumber.profiles = {
  main = {
    hardware.video-capture = optional
  }
}
